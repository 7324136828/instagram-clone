name: Build and release Windows binaries

on:
  # Merging a pull request into main pushes the merged commit and starts a release build.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify Windows x64 packages
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Isolate application settings and data for CI
        run: |
          $ciRoot = Join-Path $env:RUNNER_TEMP 'instagram-clone-ci'
          $settings = Join-Path $ciRoot 'settings'
          $database = Join-Path $ciRoot 'counter.db'
          $cache = Join-Path $ciRoot 'instagram_cache'
          "APPDATA=$settings" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "COUNTER_DB_PATH=$database" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # The import library (%TEMP%\instagram_cache by default) of anything the CI starts.
          "INSTAGRAM_CACHE_DIR=$cache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up Python
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64

      - name: Set up Node.js
        id: node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Set up Rust
        id: rust
        run: |
          # The runner image has rustup and the Visual Studio C++ build tools.
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal --no-self-update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default stable-x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = (rustc --version) -replace '[^0-9A-Za-z.]+', '-'
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Determine pip cache refresh period
        id: pip-cache-period
        run: |
          # Refresh weekly so new versions allowed by requirements can enter the cache.
          $today = [DateTime]::UtcNow.Date
          $week = $today.AddDays(-[int]$today.DayOfWeek).ToString('yyyyMMdd')
          "week=$week" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      # build.py uses these directories explicitly rather than the global caches.
      - name: Cache Python package downloads
        uses: actions/cache@v6
        with:
          path: build/pip-cache
          key: ${{ runner.os }}-${{ runner.arch }}-pip-v1-${{ steps.python.outputs.python-version }}-${{ hashFiles('backend/requirements.txt', 'backend/requirements-build.txt') }}-${{ steps.pip-cache-period.outputs.week }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pip-v1-${{ steps.python.outputs.python-version }}-${{ hashFiles('backend/requirements.txt', 'backend/requirements-build.txt') }}-
            ${{ runner.os }}-${{ runner.arch }}-pip-v1-${{ steps.python.outputs.python-version }}-

      - name: Cache npm package downloads
        uses: actions/cache@v6
        with:
          path: build/npm-cache
          key: ${{ runner.os }}-${{ runner.arch }}-npm-v1-${{ steps.node.outputs.node-version }}-${{ hashFiles('frontend/package-lock.json', 'e2e/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-npm-v1-${{ steps.node.outputs.node-version }}-

      - name: Cache downloaded crates
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-registry-v1-${{ hashFiles('windows-app/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-registry-v1-

      # windows-app/.cargo/config.toml keeps cargo's target directory in windows-app/build/target.
      - name: Cache compiled crates
        uses: actions/cache@v6
        with:
          path: windows-app/build/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-target-v1-${{ steps.rust.outputs.version }}-${{ hashFiles('windows-app/Cargo.lock', 'windows-app/.cargo/config.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-target-v1-${{ steps.rust.outputs.version }}-

      - name: Build portable web packages and smoke-test binaries
        env:
          NPM_CONFIG_PREFER_OFFLINE: 'true'
        run: |
          python build.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check the toolchain and download crates
        run: |
          .\windows-app\setup.bat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify the embedded browser pages are current
        run: |
          # web\dist is committed and must match a build of frontend\.
          .\windows-app\update-web.bat -Check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build the native app, run the tests, and smoke-test binaries
        run: |
          .\windows-app\build.bat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run backend, launcher, and packaging tests
        run: |
          .\.venv\Scripts\python.exe -m unittest discover -s backend/tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install browser test dependencies
        working-directory: e2e
        run: |
          npm.cmd ci --cache "$env:GITHUB_WORKSPACE/build/npm-cache" --prefer-offline
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run browser tests
        working-directory: e2e
        run: |
          npm.cmd run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm.cmd test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package binaries and generate timestamp version
        id: package
        run: |
          # UTC: YYYY.MM.DDHHmm. The version is also the release tag, without a prefix.
          $version = [DateTime]::UtcNow.ToString('yyyy.MM.ddHHmm')
          $destination = Join-Path $env:GITHUB_WORKSPACE 'build/release-assets'
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          foreach ($profile in @('Debug', 'Release')) {
            $source = Join-Path $env:GITHUB_WORKSPACE "build/dist/$profile"
            $archive = Join-Path $destination "instagram-clone-$version-windows-x64-$profile.zip"
            [System.IO.Compression.ZipFile]::CreateFromDirectory(
              $source, $archive, [System.IO.Compression.CompressionLevel]::Optimal, $true
            )
            $source = Join-Path $env:GITHUB_WORKSPACE "windows-app/build/dist/$profile"
            $archive = Join-Path $destination "instagram-clone-app-$version-windows-x64-$profile.zip"
            [System.IO.Compression.ZipFile]::CreateFromDirectory(
              $source, $archive, [System.IO.Compression.CompressionLevel]::Optimal, $true
            )
          }
          $checksums = Get-ChildItem -LiteralPath $destination -Filter '*.zip' |
            Sort-Object Name | ForEach-Object {
              $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            }
          $checksums | Set-Content -LiteralPath (Join-Path $destination 'SHA256SUMS.txt') -Encoding ascii
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "Built Windows x64 packages: **$version** (UTC)." |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64-${{ steps.package.outputs.version }}
          path: build/release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish GitHub release
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v7
        with:
          name: windows-x64-${{ needs.build.outputs.version }}
          path: release-assets

      - name: Create timestamped release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          cat > release-notes.md <<'EOF'
          Portable Windows x64 packages of the Instagram clone. Two packages per profile: `instagram-clone-*` is the web stack (extract and run `run.bat`; `README.txt` explains roles, ports and the library folder), `instagram-clone-app-*` is the native Windows viewer (extract and start `instagram-windows-app.exe`, or drag pictures or a folder onto it).

          - **Debug:** the web package listens on `127.0.0.1`; the native exe opens a console window that shows its log.
          - **Release:** the web package listens on `0.0.0.0` (LAN). Run `run-backend.bat` on one machine and `run-frontend.bat --backend-url http://<backend-ip>:<port>` on another to split frontend and backend. There is no password: anyone on the same network can view and change the imported library, so use Debug on networks you do not trust. The native exe is optimised, without a console window.

          Nothing has to be installed: the web package's server.exe serves the included frontend and API; the native exe needs only 64-bit Windows 10 or 11. HEIC and AVIF pictures additionally need the HEIF Image Extensions from the Microsoft Store. Keep each package's whole folder (`public`, `runtime.json`, `port_mapping.json`, `licenses`) together when you pass it on.

          `SHA256SUMS.txt` contains checksums for all ZIPs. The release version uses UTC in `YYYY.MM.DDHHmm` format.
          EOF
          gh release create "$RELEASE_VERSION" release-assets/* \
            --repo "$GH_REPO" \
            --target "$RELEASE_COMMIT" \
            --title "$RELEASE_VERSION" \
            --notes-file release-notes.md \
            --generate-notes
